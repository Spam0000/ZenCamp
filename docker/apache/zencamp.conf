# =====================================================================
#  ZenCamp — Configuration Apache
#
#  DocumentRoot reste /var/www/html : seule la vitrine statique y est
#  déposée. Le code PHP vit dans /var/www/zencamp, hors racine web, et
#  n'est atteignable que par l'alias ci-dessous.
# =====================================================================

# La version de PHP et d'Apache renseignent l'attaquant sur les
# vulnérabilités connues applicables : on ne les annonce pas.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# ---------------------------------------------------------------------
# Point d'entrée applicatif : /app/connexion.php
# ---------------------------------------------------------------------
Alias /app /var/www/zencamp/src/public

# Le dossier src/ porte son propre .htaccess, qui interdit tout accès
# direct. On le laisse s'appliquer : c'est la défense en profondeur
# prévue par le projet, active même si cette configuration disparaît.
<Directory /var/www/zencamp/src>
    AllowOverride All
    Require all denied
</Directory>

# Seul src/public est ouvert. Cette section porte sur un chemin plus
# profond : elle est évaluée après le .htaccess du dossier parent et
# l'emporte donc sur lui.
<Directory /var/www/zencamp/src/public>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex connexion.php index.php
</Directory>

# Les dossiers tests/ et config/ ne doivent jamais être servis.
<Directory /var/www/zencamp/tests>
    Require all denied
</Directory>

<Directory /var/www/zencamp/src/config>
    Require all denied
</Directory>

# ---------------------------------------------------------------------
# En-têtes de sécurité, appliqués aussi aux fichiers statiques que PHP
# ne traverse pas (Html::entetesSecurite ne couvre que les pages PHP).
# ---------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always unset X-Powered-By
</IfModule>
