; =====================================================================
;  ZenCamp — Réglages PHP du conteneur
; =====================================================================

; --- Divulgation d'information ---------------------------------------
; Le détail d'une erreur PHP (chemin, requête, version) renseigne
; l'attaquant : il part dans les logs, jamais dans la réponse HTTP.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; --- Sessions ---------------------------------------------------------
; Doublent les réglages posés par Session::start(), pour couvrir les
; scripts qui ouvriraient une session sans passer par la classe.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.sid_length = 48
session.sid_bits_per_character = 6

; --- Téléversements ---------------------------------------------------
upload_max_filesize = 5M
post_max_size = 8M
max_file_uploads = 10

; --- Divers -----------------------------------------------------------
date.timezone = Europe/Paris
max_execution_time = 30
memory_limit = 256M

; --- OPcache ----------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
